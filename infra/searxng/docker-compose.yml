# Self-hosted SearXNG for LAZOS web research.
# Bound to 127.0.0.1 only — never exposed to the network.
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: lazos-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
    env_file:
      - path: ./.env
        required: false
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
