# Minimal SearXNG configuration for LAZOS (local, JSON API enabled).
use_default_settings: true

general:
  instance_name: "LAZOS Research"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

server:
  # Overridden at runtime by SEARXNG_SECRET from .env (generated by scripts/searxng.sh)
  secret_key: "lazos-local-only-change-me"
  limiter: false
  image_proxy: false
  public_instance: false

ui:
  static_use_hash: true

engines:
  - name: wikipedia
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: brave
    disabled: false
