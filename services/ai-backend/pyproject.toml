[project]
name = "lazos-ai-backend"
version = "1.0.0"
description = "LAZOS local AI backend: inference, speech, research, conversations"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore:Setting the shape on a NumPy array:DeprecationWarning"]
markers = [
    "integration: needs a running Ollama with the configured model (deselect with -m 'not integration')",
    "network: needs internet access",
    "models: needs locally installed speech models",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "ASYNC109", "ASYNC110", "ASYNC220", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "RUF059"]
"evals/**" = ["E501"]  # benchmark data and report formatting
"app/memory/*" = ["E501"]  # regex patterns and prompt examples
"app/feedback/*" = ["E501"]  # regex patterns and SQL
"app/research/*" = ["E501"]  # regex patterns and table rendering
